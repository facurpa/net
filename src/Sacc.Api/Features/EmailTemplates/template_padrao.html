<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SACC — Alerta de Contas Viradas</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="640" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#1F3864;padding:20px 32px;color:#ffffff;">
              <h1 style="margin:0;font-size:20px;">SACC — Sistema de Acompanhamento Contábil</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 16px;font-size:15px;">
                Foram identificadas <strong>{{quantidade_contas}}</strong> conta(s) com saldo de natureza invertida
                na verificação executada em <strong>{{data_execucao}}</strong>.
              </p>
              {{tabela_contas_viradas}}
              <p style="margin:24px 0 0;font-size:13px;color:#666;">
                Esta é uma mensagem automática do monitor de contas viradas. Não responda a este e-mail.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
